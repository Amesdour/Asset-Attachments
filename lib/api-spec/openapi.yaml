openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Landfill Discharges & Waste Operations Analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Landfill analytics dashboard endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get operational KPI summary
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: wasteType
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/timeseries:
    get:
      operationId: getDashboardTimeseries
      tags: [dashboard]
      summary: Get time-series waste weight data
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: wasteType
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
        - in: query
          name: granularity
          schema: { type: string, enum: [daily, weekly] }
      responses:
        "200":
          description: Time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeseriesPoint"

  /dashboard/waste-categories:
    get:
      operationId: getDashboardWasteCategories
      tags: [dashboard]
      summary: Get collected vs treated volume by waste category
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: Waste category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteCategoryBar"

  /dashboard/treatment-methods:
    get:
      operationId: getDashboardTreatmentMethods
      tags: [dashboard]
      summary: Get treatment method distribution (donut chart)
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: wasteType
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: Treatment method breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreatmentMethodSlice"

  /dashboard/forecast:
    get:
      operationId: getDashboardForecast
      tags: [dashboard]
      summary: Get landfill capacity forecast (6-12 months)
      parameters:
        - in: query
          name: months
          schema: { type: integer }
      responses:
        "200":
          description: Capacity forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResult"

  /dashboard/logs:
    get:
      operationId: getDashboardLogs
      tags: [dashboard]
      summary: Get recent waste collection logs
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: wasteType
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Paginated waste logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteLogsPage"

  /dashboard/ai-insights:
    post:
      operationId: getAiInsights
      tags: [dashboard]
      summary: Get AI-powered operational insights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiInsightsRequest"
      responses:
        "200":
          description: AI operational insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsightsResult"

  /dashboard/filters/options:
    get:
      operationId: getDashboardFilterOptions
      tags: [dashboard]
      summary: Get available filter options (sites, waste types)
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"

  /dashboard/sites-breakdown:
    get:
      operationId: getDashboardSitesBreakdown
      tags: [dashboard]
      summary: Per-site capacity, volume, revenue and waste type breakdown
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
      responses:
        "200":
          description: Sites breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteBreakdown"

  /dashboard/clients-ranking:
    get:
      operationId: getDashboardClientsRanking
      tags: [dashboard]
      summary: Client performance ranking by volume and revenue
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: Clients ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRanking"

  /dashboard/operators-performance:
    get:
      operationId: getDashboardOperatorsPerformance
      tags: [dashboard]
      summary: Operator-level performance metrics
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: Operators performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorPerformance"

  /dashboard/revenue-breakdown:
    get:
      operationId: getDashboardRevenueBreakdown
      tags: [dashboard]
      summary: Revenue breakdown by site, waste type, payment method and client
      parameters:
        - in: query
          name: dateFrom
          schema: { type: string }
        - in: query
          name: dateTo
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        "200":
          description: Revenue breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueBreakdown"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardKpis:
      type: object
      required:
        - totalWasteCurrentMonth
        - totalWasteLastMonth
        - wasteTrend
        - activeOperationsToday
        - capacityUsedPercent
        - diversionRate
        - diversionRateTrend
        - totalRevenue
        - totalDischarges
        - avgNetWeightMt
        - revenuePerTonne
        - outstandingInvoicesTotal
        - overdueInvoicesCount
      properties:
        totalWasteCurrentMonth:
          type: number
        totalWasteLastMonth:
          type: number
        wasteTrend:
          type: number
        activeOperationsToday:
          type: integer
        capacityUsedPercent:
          type: number
        diversionRate:
          type: number
        diversionRateTrend:
          type: number
        totalRevenue:
          type: number
          description: Total revenue all time (DZD)
        totalDischarges:
          type: integer
          description: Total discharge count
        avgNetWeightMt:
          type: number
          description: Average net weight per discharge in metric tons
        revenuePerTonne:
          type: number
          description: Average revenue per tonne (DZD/t)
        outstandingInvoicesTotal:
          type: number
          description: Total outstanding invoice amount (DZD)
        overdueInvoicesCount:
          type: integer
          description: Number of overdue invoices

    TimeseriesPoint:
      type: object
      required: [date, weightMt]
      properties:
        date:
          type: string
        weightMt:
          type: number
        revenue:
          type: number

    WasteCategoryBar:
      type: object
      required: [category, collected, treated]
      properties:
        category:
          type: string
        collected:
          type: number
        treated:
          type: number
        revenue:
          type: number
        revPerTonne:
          type: number

    TreatmentMethodSlice:
      type: object
      required: [method, value, percent]
      properties:
        method:
          type: string
        value:
          type: number
        percent:
          type: number

    ForecastResult:
      type: object
      required: [historicalPoints, forecastPoints, capacityMaxMt, warningMonths, willExceedCapacity, siteProjections, revenueHistorical, revenueForecast]
      properties:
        historicalPoints:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        forecastPoints:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        capacityMaxMt:
          type: number
        warningMonths:
          type: ["integer", "null"]
        willExceedCapacity:
          type: boolean
        siteProjections:
          type: array
          items:
            $ref: "#/components/schemas/SiteProjection"
        revenueHistorical:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
        revenueForecast:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"

    SiteProjection:
      type: object
      required: [siteId, siteName, usedMt, capacityMt, pctUsed, monthlyRateMt, yearsUntilFull]
      properties:
        siteId:
          type: string
        siteName:
          type: string
        usedMt:
          type: number
        capacityMt:
          type: number
        pctUsed:
          type: number
        monthlyRateMt:
          type: number
        yearsUntilFull:
          type: number

    RevenuePoint:
      type: object
      required: [date, revenue]
      properties:
        date:
          type: string
        revenue:
          type: number
        isForecast:
          type: boolean

    ForecastPoint:
      type: object
      required: [date, cumulativeVolume]
      properties:
        date:
          type: string
        cumulativeVolume:
          type: number
        isForecast:
          type: boolean

    WasteLogsPage:
      type: object
      required: [logs, total, page, pageSize]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/WasteLog"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    WasteLog:
      type: object
      required: [id, timestamp, weightMt, wasteType, wasteCode, truckId, site, treatmentStatus, treatmentMethod]
      properties:
        id:
          type: string
        timestamp:
          type: string
        weightMt:
          type: number
        wasteType:
          type: string
        wasteCode:
          type: string
        truckId:
          type: string
        site:
          type: string
        treatmentStatus:
          type: string
        treatmentMethod:
          type: string
        clientName:
          type: ["string", "null"]
        payMethod:
          type: ["string", "null"]
        gross:
          type: number
        tare:
          type: number
        total:
          type: number
        correctionReason:
          type: ["string", "null"]
        unitPrice:
          type: number

    AiInsightsRequest:
      type: object
      properties:
        filters:
          type: object

    AiInsightsResult:
      type: object
      required: [insights]
      properties:
        insights:
          type: array
          items:
            $ref: "#/components/schemas/InsightItem"

    InsightItem:
      type: object
      required: [category, severity, title, description, action]
      properties:
        category:
          type: string
        severity:
          type: string
        title:
          type: string
        metric:
          type: string
        description:
          type: string
        action:
          type: string

    FilterOptions:
      type: object
      required: [sites, wasteTypes]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        wasteTypes:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string

    SiteBreakdown:
      type: object
      required: [siteId, siteName, siteType, region, capacityMt, usedMt, pctUsed, dischargeCount, totalWeightMt, totalRevenue, revPerTonne, acceptedWaste]
      properties:
        siteId:
          type: string
        siteName:
          type: string
        siteType:
          type: string
        region:
          type: string
        capacityMt:
          type: number
        usedMt:
          type: number
        pctUsed:
          type: number
        dischargeCount:
          type: integer
        totalWeightMt:
          type: number
        totalRevenue:
          type: number
        revPerTonne:
          type: number
        acceptedWaste:
          type: array
          items:
            type: string
        wasteBreakdown:
          type: array
          items:
            type: object
            required: [wasteType, label, weightMt, revenue]
            properties:
              wasteType:
                type: string
              label:
                type: string
              weightMt:
                type: number
              revenue:
                type: number

    ClientRanking:
      type: object
      required: [clientId, clientName, clientType, payType, totalWeightMt, totalRevenue, dischargeCount, invoiceStatus, outstandingBalance, creditLimit, creditUsed]
      properties:
        clientId:
          type: string
        clientName:
          type: string
        clientType:
          type: string
        payType:
          type: string
        totalWeightMt:
          type: number
        totalRevenue:
          type: number
        dischargeCount:
          type: integer
        invoiceStatus:
          type: string
        outstandingBalance:
          type: number
        creditLimit:
          type: number
        creditUsed:
          type: number
        weightLimitYear:
          type: number
        weightUsedYear:
          type: number
        lastDischarge:
          type: ["string", "null"]

    OperatorPerformance:
      type: object
      required: [operatorId, dischargeCount, totalWeightMt, totalRevenue, cancelledCount, correctionCount, cancelRate, avgNetMt]
      properties:
        operatorId:
          type: string
        operatorName:
          type: ["string", "null"]
        dischargeCount:
          type: integer
        totalWeightMt:
          type: number
        totalRevenue:
          type: number
        cancelledCount:
          type: integer
        correctionCount:
          type: integer
        cancelRate:
          type: number
        avgNetMt:
          type: number
        siteName:
          type: ["string", "null"]

    RevenueBreakdown:
      type: object
      required: [bySite, byWasteType, byPayMethod, byClient, invoiceSummary]
      properties:
        bySite:
          type: array
          items:
            type: object
            required: [siteId, siteName, revenue, weightMt, revPerTonne, dischargeCount]
            properties:
              siteId:
                type: string
              siteName:
                type: string
              revenue:
                type: number
              weightMt:
                type: number
              revPerTonne:
                type: number
              dischargeCount:
                type: integer
        byWasteType:
          type: array
          items:
            type: object
            required: [wasteType, label, revenue, weightMt, revPerTonne]
            properties:
              wasteType:
                type: string
              label:
                type: string
              revenue:
                type: number
              weightMt:
                type: number
              revPerTonne:
                type: number
        byPayMethod:
          type: array
          items:
            type: object
            required: [method, revenue, percent, count]
            properties:
              method:
                type: string
              revenue:
                type: number
              percent:
                type: number
              count:
                type: integer
        byClient:
          type: array
          items:
            type: object
            required: [clientName, revenue, weightMt, count]
            properties:
              clientName:
                type: string
              revenue:
                type: number
              weightMt:
                type: number
              count:
                type: integer
        invoiceSummary:
          type: object
          required: [totalBilled, totalPaid, totalOutstanding, overdueCount, pendingCount, paidCount]
          properties:
            totalBilled:
              type: number
            totalPaid:
              type: number
            totalOutstanding:
              type: number
            overdueCount:
              type: integer
            pendingCount:
              type: integer
            paidCount:
              type: integer
