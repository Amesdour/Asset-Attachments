kind = "data-app"
previewPath = "/"
title = "Landfill Analytics Dashboard"
version = "1.0.0"
id = "landfill-dashboard"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23847

[services.development]
run = "pnpm --filter @workspace/landfill-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landfill-dashboard", "run", "build" ]
publicDir = "artifacts/landfill-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23847"
BASE_PATH = "/"
